chain:
  bech32_prefix: im
  modules:
    - "message_type"
    - "messages"
    - "telemetry"
    - "pruning"
    - "actions"
    - "consensus"
    - "daily refetch"
    - "modules"
    - "auth"
    - "bank"
    - "feegrant"
    - "epochs"
    - "immint"
    - "assets"
    - "avs"
    - "operator"
    - "delegation"
    - "dogfood"
    - "oracle"
    - "slashing"
    - "tokenomics"

telemetry:
  port: 26658

pruning:
  keep_recent: 200000
  keep_every: 10000
  interval: 5000

dogfood:
  chain_id_without_revision: "imuachaintestnet_233"

tokenomics:
  genesis_supply: 314159265                    # from tokenomics documentation
  genesis_pool_ratio: "0.0300"                   # 3% of genesis supply
  genesis_pool_airdrop_duration: 90            # 90 days after TGE
  genesis_pool_airdrop_interval: 7             # every 7 days (weekly)
  liquidity_incentive_ratios: # annual liquidity incentive ratios
    - "0.0200"
    - "0.0100"
    - "0.0050"
    - "0.0025"
    - "0.0013"
  liquidity_incentive_airdrop_duration: 20   # 20 years
  liquidity_incentive_airdrop_interval: "0.25"   # every quarter (90 days ≈ 0.25 years)

node:
  type: remote
  config:
    rpc:
      client_name: imuad
      address: "http://localhost:26657"
      max_connections: 20
    grpc:
      address: "localhost:9090"
      insecure: true

parsing:
  workers: 1
  start_height: 1
  average_block_time: 5s
  listen_new_blocks: true
  parse_old_blocks: true
  parse_genesis: true

database:
  url: "postgresql://user:password@localhost:5432/db_name?sslmode=disable&search_path=public"
  max_open_connections: 10
  max_idle_connections: 10
  partition_size: 100000
  partition_batch_size: 1000

logging:
  level: "debug"
  format: "text"

actions:
  host: "callisto"
  port: 3000