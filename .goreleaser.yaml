version: 2

# before:
#   hooks:
#     - go mod download

builds:
  - id: "callisto-darwin"
    main: ./cmd/callisto
    binary: bin/callisto
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-std=gnu11
      - CC=o64-clang
      - CXX=o64-clang++
    goos:
      - darwin
    goarch:
      - amd64
    flags:
      - -tags=cgo
    ldflags:
      -X github.com/forbole/juno/v5/cmd.Version={{.Version}} -X github.com/forbole/juno/v5/cmd.Commit={{.Commit}}
  - id: "callisto-darwin-arm64"
    main: ./cmd/callisto
    binary: bin/callisto
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-std=gnu11
      - CC=oa64-clang
      - CXX=oa64-clang++
    goos:
      - darwin
    goarch:
      - arm64
    flags:
      - -tags=cgo
    ldflags:
      -X github.com/forbole/juno/v5/cmd.Version={{.Version}} -X github.com/forbole/juno/v5/cmd.Commit={{.Commit}}
  - id: "callisto-linux"
    main: ./cmd/callisto
    binary: bin/callisto
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-std=gnu11
      - CC=gcc
      - CXX=g++
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -tags=cgo
    ldflags:
      -X github.com/forbole/juno/v5/cmd.Version={{.Version}} -X github.com/forbole/juno/v5/cmd.Commit={{.Commit}}
  - id: "callisto-linux-arm64"
    main: ./cmd/callisto
    binary: bin/callisto
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-std=gnu11
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -tags=cgo
    ldflags:
      -X github.com/forbole/juno/v5/cmd.Version={{.Version}} -X github.com/forbole/juno/v5/cmd.Commit={{.Commit}}
  - id: "callisto-windows"
    main: ./cmd/callisto
    binary: bin/callisto
    env:
      - CGO_ENABLED=1
      - CGO_CFLAGS=-std=gnu11
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -tags=cgo
      - -buildmode=exe
    ldflags:
      -X github.com/forbole/juno/v5/cmd.Version={{.Version}} -X github.com/forbole/juno/v5/cmd.Commit={{.Commit}}

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{- title .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        format: zip
    builds:
      - callisto-darwin
      - callisto-darwin-arm64
      - callisto-windows
      - callisto-linux
      - callisto-linux-arm64
  
checksum:
  name_template: 'checksums.txt'
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
snapshot:
  name_template: "{{ .Tag }}-{{ .Branch }}@{{ .ShortCommit }}-{{ .GitTreeState }}"
