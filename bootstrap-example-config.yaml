chain:
  bech32_prefix: im
  modules:
    - "bootstrap"

telemetry:
  port: 26658

pruning:
  keep_recent: 200000
  keep_every: 10000
  interval: 5000

dogfood:
  chain_id_without_revision: "imuachaintestnet_233"

bootstrap:
  eth_http: ""
  eth_websocket: ""
  btc_rpc: ""
  xrp_rpc: ""
  bootstrap_addr: ""
  eth_update_interval: 1440
  btc_update_interval: 5
  xrp_update_interval: 5
  price_update_interval: 60
  eth_lz_chain_id: 40217
  client_chain_info:
    - name: "Holesky"
      meta_info: "Ethereum-testnet known as Holesky"
      lz_chain_id: 40217
    - name: "Bitcoin"
      meta_info: "Bitcoin mainnet"
      lz_chain_id: 1
    - name: "XRP Ledger"
      meta_info: "XRP Ledger mainnet"
      lz_chain_id: 2
  staking_token_infos:
    - asset_id: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb_0x1"
      name: "Bitcoin"
      symbol: "BTC"
      address: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      decimals: 8
      lz_chain_id: 1
    - asset_id: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb_0x2"
      name: "XRP"
      symbol: "XRP"
      address: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      decimals: 6
      lz_chain_id: 2
  token_oracle_feeds:
    - asset_id: ""
      oracle_addr: ""

node:
  type: none
  config:
    rpc:
      client_name: imuad
      address: "http://localhost:26657"
      max_connections: 20
    grpc:
      address: "localhost:9090"
      insecure: true

parsing:
  workers: 1
  start_height: 1
  average_block_time: 5s
  listen_new_blocks: true
  parse_old_blocks: true
  parse_genesis: true

database:
  url: "postgresql://user:password@localhost:5432/db_name?sslmode=disable&search_path=public"
  max_open_connections: 10
  max_idle_connections: 10
  partition_size: 100000
  partition_batch_size: 1000

logging:
  level: "debug"
  format: "text"

actions:
  host: "callisto"
  port: 3000