chain:
  bech32_prefix: im
  modules:
    - "telemetry"
    - "bootstrap"

telemetry:
  port: 26658

pruning:
  keep_recent: 200000
  keep_every: 10000
  interval: 5000

bootstrap:
  eth_http: ""
  eth_websocket: ""
  btc_rpc: ""
  xrp_rpc: ""
  bootstrap_addr: "0xf21FB1667A8Aa3D3ea365D3D1D257f3E4fdd0651"
  eth_update_interval: 1440
  btc_update_interval: 5
  xrp_update_interval: 5
  price_update_interval: 60
  eth_lz_chain_id: 40217
  client_chain_infos:
    - name: "Hoodi"
      meta_info: "Ethereum-testnet known as Hoodi"
      lz_chain_id: 40217
    - name: "Bitcoin"
      meta_info: "Bitcoin mainnet"
      lz_chain_id: 1
    - name: "XRP Ledger"
      meta_info: "XRP Ledger mainnet"
      lz_chain_id: 2
  staking_token_infos:
    - asset_id: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb_0x1"
      name: "Bitcoin"
      symbol: "BTC"
      address: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      decimals: 8
      lz_chain_id: 1
    - asset_id: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb_0x2"
      name: "XRP"
      symbol: "XRP"
      address: "0xbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      decimals: 6
      lz_chain_id: 2
  token_oracle_feeds:
    - asset_id: ""
      oracle_addr: ""

database:
  url: "postgresql://imua:123456@localhost:5432/imuachain?sslmode=disable&search_path=public"
  max_open_connections: 10
  max_idle_connections: 10
  partition_size: 100000
  partition_batch_size: 1000

logging:
  level: "debug"
  format: "text"

actions:
  host: "callisto"
  port: 3000