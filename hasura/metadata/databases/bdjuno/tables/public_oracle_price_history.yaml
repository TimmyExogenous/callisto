table:
  name: oracle_price_history
  schema: public
object_relationships:
- name: oracle_token_config
  using:
    foreign_key_constraint_on: token_id
select_permissions:
- permission:
    allow_aggregations: false
    columns:
    - round_id
    - token_id
    - price_decimals
    - price
    - price_timestamp
    filter: {}
    limit: 100
  role: anonymous
