table:
  name: operator_assets
  schema: public
object_relationships:
- name: assets_token
  using:
    foreign_key_constraint_on: asset_id
- name: operator
  using:
    manual_configuration:
      column_mapping:
        operator_addr: earnings_addr
      insertion_order: null
      remote_table:
        name: operators
        schema: public
select_permissions:
- permission:
    columns:
    - operator_addr
    - asset_id
    - total_amount
    - pending_undelegation_amount
    - total_share
    - self_share
    - other_share
    filter: {}
    limit: 10
  role: anonymous
