table:
  name: bootstrap_staker_assets
  schema: public

object_relationships:
  - name: token
    using:
      foreign_key_constraint_on:
        column: asset_id
        table:
          name: bootstrap_tokens
          schema: public

array_relationships:
  - name: delegation_states
    using:
      foreign_key_constraint_on:
        column: staker_id
        table:
          name: bootstrap_delegation_states
          schema: public

select_permissions:
  - permission:
      columns:
        - staker_id
        - asset_id
        - deposited
        - withdrawable
        - delegated
        - updated_at
      filter: {}
      limit: 1000
    role: anonymous
