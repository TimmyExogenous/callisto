table:
  name: bootstrap_operator_assets
  schema: public

object_relationships:
  - name: validator
    using:
      foreign_key_constraint_on:
        column: operator_addr
        table:
          name: bootstrap_validator
          schema: public
  - name: token
    using:
      foreign_key_constraint_on:
        column: asset_id
        table:
          name: bootstrap_tokens
          schema: public

select_permissions:
  - permission:
      columns:
        - operator_addr
        - asset_id
        - total_amount
        - self_amount
        - other_amount
        - updated_at
      filter: {}
      limit: 1000
    role: anonymous
