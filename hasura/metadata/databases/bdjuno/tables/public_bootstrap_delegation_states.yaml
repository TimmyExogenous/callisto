table:
  name: bootstrap_delegation_states
  schema: public

object_relationships:
  - name: validator
    using:
      foreign_key_constraint_on:
        column: operator_addr
        table:
          name: bootstrap_validator
          schema: public
  - name: token
    using:
      foreign_key_constraint_on:
        column: asset_id
        table:
          name: bootstrap_tokens
          schema: public
  - name: staker_asset
    using:
      foreign_key_constraint_on:
        column: staker_id
        table:
          name: bootstrap_staker_assets
          schema: public

select_permissions:
  - permission:
      columns:
        - staker_id
        - asset_id
        - operator_addr
        - delegated
        - updated_at
      filter: {}
      limit: 1000
    role: anonymous
