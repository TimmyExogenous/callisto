table:
  name: validator
  schema: public
object_relationships:
- name: proposal_validator_status_snapshot
  using:
    manual_configuration:
      column_mapping:
        consensus_address: validator_address
      insertion_order: null
      remote_table:
        name: proposal_validator_status_snapshot
        schema: public
array_relationships:
- name: fk_cons_key_current
  using:
    manual_configuration:
      column_mapping:
        consensus_address: cons_addr
      insertion_order: null
      remote_table:
        name: consensus_keys
        schema: public
- name: fk_cons_key_old
  using:
    manual_configuration:
      column_mapping:
        consensus_address: prev_cons_addr
      insertion_order: null
      remote_table:
        name: consensus_keys
        schema: public
- name: blocks
  using:
    foreign_key_constraint_on:
      column: proposer_address
      table:
        name: block
        schema: public
- name: double_sign_votes
  using:
    foreign_key_constraint_on:
      column: validator_address
      table:
        name: double_sign_vote
        schema: public
- name: pre_commits
  using:
    foreign_key_constraint_on:
      column: validator_address
      table:
        name: pre_commit
        schema: public
- name: proposal_validator_status_snapshots
  using:
    foreign_key_constraint_on:
      column: validator_address
      table:
        name: proposal_validator_status_snapshot
        schema: public
- name: validator_signing_infos
  using:
    manual_configuration:
      column_mapping:
        consensus_address: validator_address
      insertion_order: null
      remote_table:
        name: validator_signing_info
        schema: public
- name: validator_voting_powers
  using:
    foreign_key_constraint_on:
      column: validator_address
      table:
        name: validator_voting_power
        schema: public
select_permissions:
- permission:
    allow_aggregations: false
    columns:
    - consensus_address
    - consensus_pubkey
    filter: {}
    limit: 100
  role: anonymous
